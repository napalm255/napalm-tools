[package]
name = "napalm-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, private, idempotent user-space system configuration for Linux"
license = "MIT"
repository = "https://github.com/napalm255/napalm-tools"

[[bin]]
name = "nt"
path = "src/main.rs"

[lib]
name = "napalm_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["cargo", "string"] }
clap_complete = "4.6.9"
console = "0.16.4"
globset = "0.4.20"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
