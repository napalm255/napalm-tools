# napalm-tools configuration.
#
# Copy to ~/.config/napalm-tools/config.toml and edit. Nothing here is
# required: with no file at all, `nt apply` installs every bundle the platform
# can host, with starship as the prompt.
#
# `nt bundles --detail` shows the catalog; `nt config show` shows the fully
# resolved configuration; `nt status` compares it with the machine.

# --- Bundles ---------------------------------------------------------------
# Every bundle is on. Name one here only to turn it off. A name not in the
# catalog is an error, not a silent no-op. Bundles that need a desktop
# session (desktop, fonts) are skipped automatically on servers, in
# containers and under WSL.

[bundles]
android = false          # a large download; off on this machine

# --- Shell -----------------------------------------------------------------
# One of: starship (default), oh-my-posh, powerbash. Only the chosen prompt is
# installed, and `nt shell-init bash` prints the line that activates it.

[shell]
prompt = "starship"

# --- Extra packages --------------------------------------------------------
# The escape hatch: packages outside the catalog, named per manager. Unlike
# catalog packages these have no fallback, so the manager must be usable here.
# Managers: brew, brew-cask, npm, bun, flatpak, mise, dnf
# mise entries are tool@version, as `mise use` takes them.

[extra]
brew = ["jless", "dust"]
mise = ["terraform@latest"]

# --- Run options -----------------------------------------------------------

[options]
# Also upgrade packages already installed. Off by default so a routine run
# stays fast and never pulls a breaking update at an awkward moment.
upgrade = false

# Exit 2 when a package has no provider on this host. Useful in CI.
strict = false

# --- Dotfiles --------------------------------------------------------------
# Runs after packages converge, so chezmoi itself can come from the catalog on
# a fresh machine.

[dotfiles]
enabled = true
repo    = "https://github.com/napalm255/dotfiles"
apply   = true

# --- Per-host overrides ----------------------------------------------------
# Each key is a glob matched against the machine's hostname (the full FQDN).
# Tables apply in FILE ORDER and later matches win, so write them general
# first, specific last. There is no hidden specificity ranking.

[host."*.naponline.net"]
bundles = { android = true }

[host."wsl-*"]
shell = { prompt = "oh-my-posh" }

[host."build-*"]
bundles  = { ai = false }
dotfiles = { enabled = false }
