# Dev tools for working on napalm-tools. `just setup` installs them; the
# devcontainer does that on create. Rust itself is pinned by
# rust-toolchain.toml and managed by rustup, so it is deliberately absent
# here: two managers for one toolchain leave rustup with half a toolchain.
[tools]
just = "1.55.1"
cargo-binstall = "1.22.0"

[env]
# Bottles, not builds, in the devcontainer and in end-to-end runs.
HOMEBREW_NO_AUTO_UPDATE = "1"
